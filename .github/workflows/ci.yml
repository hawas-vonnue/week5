name: before push
run-name: ${{ github.actor }} doing GitHub Actions
on: [push]
jobs:
    check-bats-version:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-node@v7
              with:
                  node-version: "24"
            - run: npm ci
            - run: npx tsc --noEmit
            - run: npx eslint .
            - run: npx jest --coverage
